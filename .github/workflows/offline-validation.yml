name: Offline validation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONHASHSEED: "0"
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package and validation tools
        run: python -m pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Type check
        run: mypy src scripts

      - name: Run tests
        run: pytest -q

      - name: Verify generated schemas
        run: python scripts/export_offline_schemas.py --check

      - name: Validate offline fixtures
        run: python scripts/validate_offline_artifacts.py

      - name: Validate documentary lineage
        run: python scripts/validate_research_registry.py

      - name: Enforce security boundary
        run: python scripts/security_gate.py

      - name: Generate deterministic fixture reports
        run: |
          output_dir="$(mktemp -d)"
          ttwo-options intelligence-run \
            --base-report reports/examples/v10_thesis_scan.json \
            --policy configs/intelligence/v11.yaml \
            --events fixtures/v11/events_empty.json \
            --profile fast_fixture \
            --json-out "$output_dir/intelligence.json" \
            --markdown-out "$output_dir/intelligence.md" \
            --html-out "$output_dir/intelligence.html"
          ttwo-options calibration report \
            --dataset fixtures/v11/historical_calibration.example.json \
            --walk-forward fixtures/v11/walk_forward.example.json \
            --output "$output_dir/offline-validation.json"
          ttwo-options position replay \
            --trajectory fixtures/v11/position_trajectory.example.json \
            --output "$output_dir/position-trajectory.json"

      - name: Check dependency consistency
        run: python -m pip check
