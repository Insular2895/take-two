    checks:
      - check_id: math-and-units
        topic: mathematical validity and units
        status: passed
        book_statement: Standard option payoffs are expressed per share.
        unchanged: Piecewise intrinsic payoffs remain structurally valid.
        modernization: Listed multiplier is explicit and whole contracts are mandatory.
        source_ids: [cboe-equity-options-contracts-2026]
        notes: Profitability is not validated.
      - check_id: american-exercise
        topic: American exercise, assignment, and physical settlement
        status: passed
        book_statement: Short equity options can be assigned before expiration.
        unchanged: Assignment and pin risk remain material.
        modernization: Short American legs require human review; stock options are physically settled.
        source_ids: [occ-odd-june-2024, cboe-equity-options-contracts-2026]
        notes: Candidate-level assignment probabilities remain unknown.
      - check_id: broker-combos
        topic: broker combo definition and preview
        status: passed
        book_statement: Multi-leg structures require all legs.
        unchanged: Exact sides, ratios, strikes, and expirations remain necessary.
        modernization: IBKR BAG contracts require combo-leg details; preview artifacts force transmit=false and whatIf=true.
        source_ids: [ibkr-tws-api-reference-2026]
        notes: This repository never calls placeOrder.
      - check_id: liquidity-and-costs
        topic: executable bid/ask, commissions, and liquidity
        status: passed
        book_statement: Theoretical value is not necessarily executable.
        unchanged: Bid/ask and costs remain integral to strategy economics.
        modernization: Long entry uses ask and short entry uses bid unless a timestamped combo quote exists.
        source_ids: [occ-odd-june-2024]
        notes: EOD quotes remain screen-grade.
      - check_id: empirical-edge
        topic: modern empirical profitability
        status: insufficient_data
        book_statement: Structural descriptions are not evidence of current excess returns.
        unchanged: null
        modernization: Recipes retain empirical_status NOT_TESTED and cannot authorize a trade.
        source_ids: []
        notes: Requires uncontaminated nested walk-forward option history.
    contradictions: []
    overall_status: passed
