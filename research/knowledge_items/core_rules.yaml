        method: payoff-grid and architecture-registry validation
        source_ids: [natenberg-options-volatility-2015, take-two-v9-reviewed-corpus]
        notes: Bounded terminal loss does not remove path, assignment, or liquidity risk.
    statement: Unknown or unbounded maximum loss is a hard veto.

