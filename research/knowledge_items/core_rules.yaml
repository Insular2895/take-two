    variables: [terminal_payoff, entry_cash, costs]
    units: {terminal_payoff: USD, entry_cash: USD, costs: USD}
    conditions: [trade request allowed_risk equals bounded_only]
    action: reject every candidate whose maximum loss is unknown or unbounded
    exceptions: []
    risks: [American early assignment can create interim exposures requiring broker review]
    contradictions: []
    parameters_provided: []
    parameters_missing: [broker margin preview]
    parameters_to_calibrate: []
