      - {leg_id: long_lower_put, option_type: put, side: long, quantity_ratio: 1, expiration_role: same, strike_role: lower}
      - {leg_id: short_center_puts, option_type: put, side: short, quantity_ratio: 2, expiration_role: same, strike_role: center}
