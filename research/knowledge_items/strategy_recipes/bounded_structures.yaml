      - {leg_id: short_center_puts, option_type: put, side: short, quantity_ratio: 2, expiration_role: same, strike_role: center}
      - {leg_id: long_upper_put, option_type: put, side: long, quantity_ratio: 1, expiration_role: same, strike_role: upper}
    spread_width: {minimum: null, maximum: null, values: [5, 10, 20], unit: USD, origin: calibration_required, source_id: null}

