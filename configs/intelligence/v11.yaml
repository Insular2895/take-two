policy_id: ttwo-probabilistic-strategy-intelligence-v11
source_status: calibration_required

# Experimental research priors. They are inputs to test, not observed frequencies.
scenario_priors:
  market_base: 0.35
  gta_success: 0.35
  delay_or_guidance_down: 0.20
  rupture: 0.10
scenario_regime_map:
  market_base: neutral
  gta_success: thesis
  delay_or_guidance_down: adverse
  rupture: rupture

family_weight_caps:
  company_primary: 1.00
  regulatory: 0.80
  fundamentals: 0.75
  market: 0.60
  options: 0.60
  attention: 0.30
  news: 0.25
  social: 0.15

likelihood_rules:
  - event_type: EVENT_GTA_DELAY_CONFIRMED
    family: company_primary
    base_weight: 1.0
    likelihood_by_scenario:
      market_base: 0.05
      gta_success: 0.01
      delay_or_guidance_down: 0.90
      rupture: 0.35
  - event_type: EVENT_RELEASE_DATE_MAINTAINED
    family: company_primary
    base_weight: 0.8
    likelihood_by_scenario:
      market_base: 0.55
      gta_success: 0.80
      delay_or_guidance_down: 0.15
      rupture: 0.30
  - event_type: EVENT_GUIDANCE_UP
    family: fundamentals
    base_weight: 0.8
    likelihood_by_scenario:
      market_base: 0.45
      gta_success: 0.80
      delay_or_guidance_down: 0.10
      rupture: 0.35
  - event_type: EVENT_GUIDANCE_DOWN
    family: fundamentals
    base_weight: 0.8
    likelihood_by_scenario:
      market_base: 0.25
      gta_success: 0.08
      delay_or_guidance_down: 0.80
      rupture: 0.50
  - event_type: EVENT_INSIDER_BUY
    family: regulatory
    base_weight: 0.4
    likelihood_by_scenario:
      market_base: 0.45
      gta_success: 0.65
      delay_or_guidance_down: 0.25
      rupture: 0.35
  - event_type: EVENT_SEARCH_INTEREST_UP
    family: attention
    base_weight: 0.25
    likelihood_by_scenario:
      market_base: 0.50
      gta_success: 0.65
      delay_or_guidance_down: 0.35
      rupture: 0.50
  - event_type: EVENT_IV_SPIKE
    family: options
    base_weight: 0.35
    likelihood_by_scenario:
      market_base: 0.30
      gta_success: 0.55
      delay_or_guidance_down: 0.50
      rupture: 0.80
  - event_type: EVENT_OPTIONS_FLOW_BULLISH
    family: options
    base_weight: 0.30
    likelihood_by_scenario:
      market_base: 0.45
      gta_success: 0.65
      delay_or_guidance_down: 0.25
      rupture: 0.45

simulation:
  paths: 1000
  horizon_days: 180
  steps: 90
  seed: 20260728
  initial_volatility: 0.35
  risk_free_rate: 0.04
  dividend_yield: 0.0
  models:
    - black_scholes_gbm
    - local_volatility
    - heston
    - heston_jump
  regimes:
    - regime: neutral
      probability: 0.35
      annual_drift: 0.06
      volatility_multiplier: 1.0
      initial_iv_shift: 0.0
      jump:
        intensity_per_year: 0.10
        log_mean: 0.0
        log_volatility: 0.05
      description: Market-implied control with limited event jumps.
    - regime: thesis
      probability: 0.35
      annual_drift: 0.18
      volatility_multiplier: 1.05
      initial_iv_shift: 0.10
      jump:
        intensity_per_year: 0.80
        log_mean: 0.08
        log_volatility: 0.10
      description: User-thesis sensitivity case; not a validated forecast.
    - regime: adverse
      probability: 0.20
      annual_drift: -0.15
      volatility_multiplier: 1.30
      initial_iv_shift: 0.25
      jump:
        intensity_per_year: 0.80
        log_mean: -0.15
        log_volatility: 0.12
      description: Delay, guidance contraction, rates, and poor execution stress.
    - regime: rupture
      probability: 0.10
      annual_drift: 0.0
      volatility_multiplier: 1.80
      initial_iv_shift: 0.50
      jump:
        intensity_per_year: 1.20
        log_mean: -0.03
        log_volatility: 0.30
      description: Two-sided extreme event sensitivity case.
  heston:
    initial_variance: 0.1225
    mean_reversion: 2.0
    long_run_variance: 0.1225
    vol_of_variance: 0.45
    correlation: -0.55
    calibration_status: illustrative
  local_volatility_nodes:
    - {time_years: 0.0, moneyness: 0.70, volatility: 0.43}
    - {time_years: 0.0, moneyness: 1.00, volatility: 0.35}
    - {time_years: 0.0, moneyness: 1.30, volatility: 0.39}
    - {time_years: 0.5, moneyness: 0.70, volatility: 0.41}
    - {time_years: 0.5, moneyness: 1.00, volatility: 0.34}
    - {time_years: 0.5, moneyness: 1.30, volatility: 0.38}
    - {time_years: 1.0, moneyness: 0.70, volatility: 0.39}
    - {time_years: 1.0, moneyness: 1.00, volatility: 0.33}
    - {time_years: 1.0, moneyness: 1.30, volatility: 0.37}

covariance_windows: [20, 60, 252]
covariance_shrinkage: 0.25
budget_eur: 1000
maximum_loss_eur: 1000
maximum_contracts: 4
candidate_pool_size: 6
optimizer_profiles:
  prudent:
    risk_aversion: 1.20
    cvar_aversion: 1.00
    execution_penalty: 0.80
    model_risk_penalty: 0.80
    maximum_allocations: 5
  balanced:
    risk_aversion: 0.65
    cvar_aversion: 0.65
    execution_penalty: 0.45
    model_risk_penalty: 0.50
    maximum_allocations: 5
  aggressive:
    risk_aversion: 0.25
    cvar_aversion: 0.30
    execution_penalty: 0.25
    model_risk_penalty: 0.25
    maximum_allocations: 5

exit_policy:
  profit_target: 1.50
  partial_profit_target: 0.80
  operational_stop_loss: 0.70
  exit_days_before_expiration: 60
  iv_crush_threshold: 0.35
  trailing_drawdown: 0.30

required_series:
  - TTWO.spot
  - EURUSD
  - USD.risk_free_rate
  - TTWO.dividend_yield
  - US.market_calendar
