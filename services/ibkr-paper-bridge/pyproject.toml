[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "take-two-ibkr-paper-bridge"
version = "0.1.0"
description = "Fail-closed outbound bridge between Take Two control and an IBKR paper session"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "ruff>=0.9,<1"]

[project.scripts]
ttwo-paper-bridge = "ttwo_ibkr_bridge.main:main"
ttwo-ibkr-readonly-snapshot = "ttwo_ibkr_bridge.readonly_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
